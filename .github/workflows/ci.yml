name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: 契约单一副本守卫（壳里必须只有一份 @pigeonbox/contracts）
        run: |
          set -euo pipefail
          # 2026-10-25 实录（3.3.28 终验）：壳仓装出**两份** @pigeonbox/contracts ——
          #   node_modules/@pigeonbox/contracts                            → 壳的钉版(0.18.7)
          #   node_modules/@pigeonbox/frontend-core/node_modules/@pigeonbox/contracts → frontend-core 传递(0.18.6)
          # npm 不去重不同版本 ⇒ frontend-core 源码的 `import type` 解析到 nested 那份
          # ⇒ 壳里存在**两份类型定义**。本次 contracts 的 TS 载荷逐字节相同，所以
          # typecheck 绿、页面正常 —— 但**下次 contracts 改 TS 载荷就会真炸**
          # （壳里两份类型不兼容）。「没炸」不等于「对」。
          #
          # 根因与修法：库线(frontend-core)的 contracts 钉版必须与壳一致。
          # 不一致时**先发 frontend-core 新版本把钉版抬齐**，再由列车 bump 抬壳的钉版
          # （重打旧 tag 没用：npm 按版本号缓存 tgz 资产，只会喂陈旧 zip）。
          n=$(find node_modules -type d -name contracts -path '*@pigeonbox*' | wc -l | tr -d ' ')
          if [ "$n" -ne 1 ]; then
            echo "::error::node_modules 里有 $n 份 @pigeonbox/contracts（必须恰好 1 份）:"
            find node_modules -type d -name contracts -path '*@pigeonbox*' | sed 's|^|  |'
            echo "::error::根因：frontend-core 的 contracts 钉版与壳不一致 ⇒ 先发 frontend-core 新版本把钉版抬齐"
            exit 1
          fi
          echo "✓ @pigeonbox/contracts 单一副本"
      - name: nginx 模板守卫(X-Forwarded-Proto 不得裸用 $scheme)
        run: |
          set -euo pipefail
          # issue #162（2026-11-10 真机复现，10.10.10.3 升 5.7.0）：
          # 前端镜像 nginx 模板无条件用 $scheme 覆写 X-Forwarded-Proto。
          # 本容器有两种部署角色，$scheme 的语义完全不同：
          #   1) 自己终结 TLS（直连部署）：$scheme == https，裸用恰好正确；
          #   2) 位于 TLS 反代之后（TLS 终结器 → 本容器 8080 明文）：$scheme == http
          #      ⇒ 把上游传来的 https 覆写成 http ⇒ 后端会话 cookie 不带 Secure
          #      + 分享链接 base 推断成 http（旧版每个部署者都得在宿主侧
          #      docker cp 出来 sed 改模板再挂回容器）。
          # 契约（机械守卫）：X-Forwarded-Proto 必须走
          #   「上游 X-Forwarded-Proto → map → 缺省回落 $scheme」，
          #   且不得出现裸的 $scheme 赋值。
          tpl_dir="${TMPL_DIR:-docker}"
          fail() { echo "::error::$*"; exit 1; }
          for f in "$tpl_dir"/*.template; do
            [ -e "$f" ] || continue
            # ① 不得出现裸的 X-Forwarded-Proto $scheme 赋值（含 ${scheme} 等花括号写法）
            #    注：判据用 [^;]*scheme 而非 \$\{?scheme\}? —— 后者在 BSD grep(macOS)
            #    上不匹配（静默漏判），本仓本地复跑与 CI(GNU grep)须同一判据。
            if grep -nE 'proxy_set_header[[:space:]]+X-Forwarded-Proto[[:space:]]+[^;]*scheme' "$f"; then
              fail "$f 出现裸的 X-Forwarded-Proto \$scheme 赋值（issue #162：TLS 反代后会丢 https）"
            fi
            grep -q 'X-Forwarded-Proto' "$f" || continue
            # ② 赋值目标必须是 map 派生变量，且该变量由 map $http_x_forwarded_proto 定义
            var=$(sed -nE 's/^[[:space:]]*proxy_set_header[[:space:]]+X-Forwarded-Proto[[:space:]]+(\$[A-Za-z_][A-Za-z0-9_]*).*/\1/p' "$f" | head -1)
            [ -n "$var" ] || fail "$f 的 X-Forwarded-Proto 未赋变量（须经 map 派生，不能写字面量）"
            mapvar=$(sed -nE 's/^[[:space:]]*map[[:space:]]+\$http_x_forwarded_proto[[:space:]]+(\$[A-Za-z_][A-Za-z0-9_]*).*/\1/p' "$f" | head -1)
            [ "$mapvar" = "$var" ] || fail "$f 的 X-Forwarded-Proto 变量 $var 未由 map \$http_x_forwarded_proto 定义（实得 $mapvar）"
            # ③ 该 map 必须同时透传 http/https，且以 $scheme 兜底（直连部署行为不变）
            block=$(sed -n '/^[[:space:]]*map[[:space:]]*\$http_x_forwarded_proto/,/^}/p' "$f")
            echo "$block" | grep -q '\$scheme' || fail "$f 的 map $var 缺 \$scheme 兜底（无上游反代的直连部署行为会变）"
            echo "$block" | grep -qE '(^|[[:space:]])https([[:space:]]|;|$)' || fail "$f 的 map $var 未透传 https"
            echo "$block" | grep -qE '(^|[[:space:]])http([[:space:]]|;|$)' || fail "$f 的 map $var 未透传 http"
          done
          echo "✓ nginx 模板 X-Forwarded-Proto 守卫通过"
      - name: Typecheck(壳+core 源)
        run: npm run typecheck
      # 应用单测在 frontend-core 仓 CI(core 携带全部视图/组件测试)
      - name: Build neutral(server/docker 镜像 flavor)
        run: npm run build
      - name: neutral 产物平台代码扫描(命中即红)
        run: |
          # 严格模式回收(1.15.2):SSO 端点白名单已下沉 frontend-core v0.1.6 的
          # HostAdapter.ssoLoginPaths(适配器声明),neutral 产物不再含任何平台
          # 字面量——此前的 api/qnap/login 精确放行(a9977a3 过渡态)已可撤。
          if grep -rloE "trimjs|pickSharedFile|fnosSsoLogin|trim_open_gateway|api/qnap|api/fnos|qnapHostAdapter" dist/assets/ >/dev/null 2>&1; then
            echo "::error::neutral 产物出现宿主平台代码——平台实现只允许进对应 flavor"
            exit 1
          fi
      # 平台 flavor 已全部迁平台仓(fnos/qnap 的 web/ 自包含构建),由各平台 CI 把守
      # 镜像正式发布在 server 仓 release.yml（与 server 同版本列车），此处仅验证
      # Dockerfile 可构建（nginx 模板/产物拷贝路径变更能被 PR 及时发现）
      - name: Docker build smoke
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org -t pigeonbox-frontend:ci .
