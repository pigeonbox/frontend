name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: 契约单一副本守卫（壳里必须只有一份 @pigeonbox/contracts）
        run: |
          set -euo pipefail
          # 2026-10-25 实录（3.3.28 终验）：壳仓装出**两份** @pigeonbox/contracts ——
          #   node_modules/@pigeonbox/contracts                            → 壳的钉版(0.18.7)
          #   node_modules/@pigeonbox/frontend-core/node_modules/@pigeonbox/contracts → frontend-core 传递(0.18.6)
          # npm 不去重不同版本 ⇒ frontend-core 源码的 `import type` 解析到 nested 那份
          # ⇒ 壳里存在**两份类型定义**。本次 contracts 的 TS 载荷逐字节相同，所以
          # typecheck 绿、页面正常 —— 但**下次 contracts 改 TS 载荷就会真炸**
          # （壳里两份类型不兼容）。「没炸」不等于「对」。
          #
          # 根因与修法：库线(frontend-core)的 contracts 钉版必须与壳一致。
          # 不一致时**先发 frontend-core 新版本把钉版抬齐**，再由列车 bump 抬壳的钉版
          # （重打旧 tag 没用：npm 按版本号缓存 tgz 资产，只会喂陈旧 zip）。
          n=$(find node_modules -type d -name contracts -path '*@pigeonbox*' | wc -l | tr -d ' ')
          if [ "$n" -ne 1 ]; then
            echo "::error::node_modules 里有 $n 份 @pigeonbox/contracts（必须恰好 1 份）:"
            find node_modules -type d -name contracts -path '*@pigeonbox*' | sed 's|^|  |'
            echo "::error::根因：frontend-core 的 contracts 钉版与壳不一致 ⇒ 先发 frontend-core 新版本把钉版抬齐"
            exit 1
          fi
          echo "✓ @pigeonbox/contracts 单一副本"
      - name: nginx 模板守卫(X-Forwarded-Proto 不得裸用 $scheme)
        run: |
          set -euo pipefail
          # issue #162（2026-11-10 真机复现，10.10.10.3 升 5.7.0）：
          # 前端镜像 nginx 模板无条件用 $scheme 覆写 X-Forwarded-Proto。
          # 本容器有两种部署角色，$scheme 的语义完全不同：
          #   1) 自己终结 TLS（直连部署）：$scheme == https，裸用恰好正确；
          #   2) 位于 TLS 反代之后（TLS 终结器 → 本容器 8080 明文）：$scheme == http
          #      ⇒ 把上游传来的 https 覆写成 http ⇒ 后端会话 cookie 不带 Secure
          #      + 分享链接 base 推断成 http（旧版每个部署者都得在宿主侧
          #      docker cp 出来 sed 改模板再挂回容器）。
          # 契约（机械守卫）：X-Forwarded-Proto 必须走
          #   「上游 X-Forwarded-Proto → map → 缺省回落 $scheme」，
          #   且不得出现裸的 $scheme 赋值。
          tpl_dir="${TMPL_DIR:-docker}"
          fail() { echo "::error::$*"; exit 1; }
          for f in "$tpl_dir"/*.template; do
            [ -e "$f" ] || continue
            # ① 不得出现裸的 X-Forwarded-Proto $scheme 赋值（含 ${scheme} 等花括号写法）
            #    注：判据用 [^;]*scheme 而非 \$\{?scheme\}? —— 后者在 BSD grep(macOS)
            #    上不匹配（静默漏判），本仓本地复跑与 CI(GNU grep)须同一判据。
            if grep -nE 'proxy_set_header[[:space:]]+X-Forwarded-Proto[[:space:]]+[^;]*scheme' "$f"; then
              fail "$f 出现裸的 X-Forwarded-Proto \$scheme 赋值（issue #162：TLS 反代后会丢 https）"
            fi
            grep -q 'X-Forwarded-Proto' "$f" || continue
            # ② 赋值目标必须是 map 派生变量，且该变量由 map $http_x_forwarded_proto 定义
            var=$(sed -nE 's/^[[:space:]]*proxy_set_header[[:space:]]+X-Forwarded-Proto[[:space:]]+(\$[A-Za-z_][A-Za-z0-9_]*).*/\1/p' "$f" | head -1)
            [ -n "$var" ] || fail "$f 的 X-Forwarded-Proto 未赋变量（须经 map 派生，不能写字面量）"
            mapvar=$(sed -nE 's/^[[:space:]]*map[[:space:]]+\$http_x_forwarded_proto[[:space:]]+(\$[A-Za-z_][A-Za-z0-9_]*).*/\1/p' "$f" | head -1)
            [ "$mapvar" = "$var" ] || fail "$f 的 X-Forwarded-Proto 变量 $var 未由 map \$http_x_forwarded_proto 定义（实得 $mapvar）"
            # ③ 该 map 必须同时透传 http/https，且以 $scheme 兜底（直连部署行为不变）
            block=$(sed -n '/^[[:space:]]*map[[:space:]]*\$http_x_forwarded_proto/,/^}/p' "$f")
            echo "$block" | grep -q '\$scheme' || fail "$f 的 map $var 缺 \$scheme 兜底（无上游反代的直连部署行为会变）"
            echo "$block" | grep -qE '(^|[[:space:]])https([[:space:]]|;|$)' || fail "$f 的 map $var 未透传 https"
            echo "$block" | grep -qE '(^|[[:space:]])http([[:space:]]|;|$)' || fail "$f 的 map $var 未透传 http"
          done
          echo "✓ nginx 模板 X-Forwarded-Proto 守卫通过"
      - name: Typecheck(壳+core 源)
        run: npm run typecheck
      # frontend#170 覆盖守卫：tgz 的 views 必须真入 typecheck 程序——
      # 此前 include 只有 *.d.ts ⇒ router 靠惰性 import 不入程序 ⇒ 视图层零断言，
      # 收紧 include 后此处 n=0 即回归。--listFiles 与 typecheck 同配置同进程形态。
      - name: Typecheck 覆盖守卫(tgz views 入程序)
        run: |
          n=$(node_modules/.bin/vue-tsc --noEmit -p tsconfig.app.json --listFiles 2>/dev/null | grep -c 'frontend-core/src/views/.*\.vue$' || true)
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::tgz views 未入 typecheck 程序(n=$n)——tsconfig.app.json include 回归(frontend#170)"
            exit 1
          fi
          echo "✓ tgz views 入程序: $n 个 .vue"
      # 应用单测在 frontend-core 仓 CI(core 携带全部视图/组件测试)
      - name: Build neutral(server/docker 镜像 flavor)
        run: npm run build
      - name: neutral 产物平台代码扫描(命中即红)
        run: |
          # 严格模式回收(1.15.2):SSO 端点白名单已下沉 frontend-core v0.1.6 的
          # HostAdapter.ssoLoginPaths(适配器声明),neutral 产物不再含任何平台
          # 字面量——此前的 api/qnap/login 精确放行(a9977a3 过渡态)已可撤。
          if grep -rloE "trimjs|pickSharedFile|fnosSsoLogin|trim_open_gateway|api/qnap|api/fnos|qnapHostAdapter" dist/assets/ >/dev/null 2>&1; then
            echo "::error::neutral 产物出现宿主平台代码——平台实现只允许进对应 flavor"
            exit 1
          fi
      # 平台 flavor 已全部迁平台仓(fnos/qnap 的 web/ 自包含构建),由各平台 CI 把守
      # 镜像正式发布在 server 仓 release.yml（与 server 同版本列车），此处仅验证
      # Dockerfile 可构建（nginx 模板/产物拷贝路径变更能被 PR 及时发现）
      - name: Docker build smoke
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org -t pigeonbox-frontend:ci .
      # frontend#169：CSP connect-src 支持注入 presign 直传跨源。
      # presign 直传的 upload_url 有两种跨源形态（S3 预签名 URL / 后端 public base
      # 与页面不同源），浏览器 XHR PUT 受 connect-src 管辖 ⇒ 只放行 'self' 时直传
      # 整体失败；而冒烟用 curl、E2E 跑 vite dev（无 CSP 头）⇒ 两条路径都测不到
      # 生产 nginx 的 CSP。故用**真实镜像入口**（官方 envsubst 渲染）+ 真实响应头断言。
      # 断言点：① 缺省仍是旧语义（只 'self'，零行为变化）② 注入后三处 CSP 逐字一致
      # ③ 占位符绝不漏进渲染结果（Dockerfile ENV 默认被删即红）④ 断言自证有牙齿。
      - name: CSP connect-src 注入渲染断言(#169)
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          img="${IMG:-pigeonbox-frontend:ci}"
          extra="https://s3.example.com https://minio.local:9000"
          cid_def=""
          cid_ext=""
          cleanup() {
            docker rm -f "$cid_def" "$cid_ext" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_conf() {
            cid="$1"
            i=0
            while [ "$i" -lt 60 ]; do
              running=$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo false)
              if [ "$running" != "true" ]; then
                docker logs "$cid" 2>&1 | tail -30 || true
                fail "$cid: 容器退出（nginx 配置错误?）"
              fi
              if docker exec "$cid" test -f /etc/nginx/conf.d/default.conf 2>/dev/null; then
                return 0
              fi
              i=$((i + 1))
              sleep 0.5
            done
            fail "$cid: 渲染产物 /etc/nginx/conf.d/default.conf 未生成"
          }

          wait_hdr() {
            port="$1"
            i=0
            while [ "$i" -lt 60 ]; do
              if curl -sfI "http://127.0.0.1:$port/" >/dev/null 2>&1; then
                return 0
              fi
              i=$((i + 1))
              sleep 0.5
            done
            fail ":$port 未就绪"
          }

          # 纯文本判据（可被自证复用）：0=通过 1=不通过
          check_conf() {
            label="$1"
            want="$2"
            conf="$3"
            # 只盯 CSP 头行：模板注释里出现该变量名是正常的（文档），
            # 真正的故障形态是 ${PB_CSP_CONNECT_SRC_EXTRA} 原样出现在 add_header 里。
            if printf '%s\n' "$conf" | grep "add_header Content-Security-Policy" | grep -q 'PB_CSP_CONNECT_SRC_EXTRA'; then
              echo "✗ $label: 占位符漏进 CSP 头（Dockerfile ENV 默认缺失/变量未定义）"
              return 1
            fi
            n=$(printf '%s\n' "$conf" | grep -c "connect-src 'self'") || true
            if [ "$n" -ne 3 ]; then
              echo "✗ $label: connect-src 出现 $n 处（应恰好 3 处）"
              return 1
            fi
            u=$(printf '%s\n' "$conf" | grep -o "connect-src[^;]*;" | sort -u | wc -l | tr -d ' ')
            if [ "$u" -ne 1 ]; then
              echo "✗ $label: 三处 connect-src 不一致"
              return 1
            fi
            if ! printf '%s\n' "$conf" | grep -qF "$want"; then
              echo "✗ $label: 期望 [$want]，实得 [$(printf '%s\n' "$conf" | grep -o "connect-src[^;]*;" | sort -u | tr '\n' ' ')]"
              return 1
            fi
            return 0
          }

          # $1=标签 $2=期望 connect-src 片段(含分号) $3=cid $4=端口
          assert_case() {
            label="$1"
            want="$2"
            cid="$3"
            port="$4"
            conf=$(docker exec "$cid" cat /etc/nginx/conf.d/default.conf) || fail "$label: 读取渲染结果失败"
            check_conf "$label" "$want" "$conf" || fail "$label: 渲染断言未过"
            wait_hdr "$port"
            hdr=$(curl -sI "http://127.0.0.1:$port/" | tr -d '\r' | grep -i '^content-security-policy:' | head -1)
            case "$hdr" in
              *"$want"*) ;;
              *) fail "$label: 响应头未含期望 connect-src，实得 $hdr" ;;
            esac
            echo "✓ $label: $want"
          }

          # A 缺省（镜像 ENV 默认：变量已定义但为空）⇒ 必须仍是旧语义 'self' only
          cid_def=$(docker run -d -p 18080:8080 "$img")
          wait_conf "$cid_def"
          assert_case "缺省(未注入)" "connect-src 'self' ;" "$cid_def" 18080

          # B 注入对象存储/后端公开源（presign 跨域直传放行）
          cid_ext=$(docker run -d -p 18081:8080 -e "PB_CSP_CONNECT_SRC_EXTRA=$extra" "$img")
          wait_conf "$cid_ext"
          assert_case "注入跨源" "connect-src 'self' $extra;" "$cid_ext" 18081

          # ④ 自证（真路径）：unset 掉该变量后让**官方入口**重渲染一遍 —— 等价于
          #    Dockerfile 的 ENV 默认被删 ⇒ 占位符原样漏进 CSP 头 ⇒ 同一判据必须判红
          #    （仍绿 = 恒绿摆设）。用 unset 而非 docker run -e VAR：后者各版本对
          #    「无值 -e」解释不一致（空串 vs 未定义），unset 语义确定。
          conf_undef=$(docker run --rm --entrypoint sh "$img" -c '
            unset PB_CSP_CONNECT_SRC_EXTRA
            rm -f /etc/nginx/conf.d/default.conf
            /docker-entrypoint.sh nginx -t >/dev/null 2>&1 || true
            cat /etc/nginx/conf.d/default.conf
          ')
          if check_conf "自证(变量未定义)" "connect-src 'self' ;" "$conf_undef"; then
            fail "断言自证失败：变量未定义（占位符漏进 CSP 头）的样本被判绿 ⇒ 门禁是恒绿摆设"
          fi
          echo "✓ 断言自证：变量未定义的样本判红"
