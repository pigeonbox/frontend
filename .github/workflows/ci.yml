name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: 契约单一副本守卫（壳里必须只有一份 @pigeonbox/contracts）
        run: |
          set -euo pipefail
          # 2026-10-25 实录（3.3.28 终验）：壳仓装出**两份** @pigeonbox/contracts ——
          #   node_modules/@pigeonbox/contracts                            → 壳的钉版(0.18.7)
          #   node_modules/@pigeonbox/frontend-core/node_modules/@pigeonbox/contracts → frontend-core 传递(0.18.6)
          # npm 不去重不同版本 ⇒ frontend-core 源码的 `import type` 解析到 nested 那份
          # ⇒ 壳里存在**两份类型定义**。本次 contracts 的 TS 载荷逐字节相同，所以
          # typecheck 绿、页面正常 —— 但**下次 contracts 改 TS 载荷就会真炸**
          # （壳里两份类型不兼容）。「没炸」不等于「对」。
          #
          # 根因与修法：库线(frontend-core)的 contracts 钉版必须与壳一致。
          # 不一致时**先发 frontend-core 新版本把钉版抬齐**，再由列车 bump 抬壳的钉版
          # （重打旧 tag 没用：npm 按版本号缓存 tgz 资产，只会喂陈旧 zip）。
          n=$(find node_modules -type d -name contracts -path '*@pigeonbox*' | wc -l | tr -d ' ')
          if [ "$n" -ne 1 ]; then
            echo "::error::node_modules 里有 $n 份 @pigeonbox/contracts（必须恰好 1 份）:"
            find node_modules -type d -name contracts -path '*@pigeonbox*' | sed 's|^|  |'
            echo "::error::根因：frontend-core 的 contracts 钉版与壳不一致 ⇒ 先发 frontend-core 新版本把钉版抬齐"
            exit 1
          fi
          echo "✓ @pigeonbox/contracts 单一副本"
      - name: Typecheck(壳+core 源)
        run: npm run typecheck
      # 应用单测在 frontend-core 仓 CI(core 携带全部视图/组件测试)
      - name: Build neutral(server/docker 镜像 flavor)
        run: npm run build
      - name: neutral 产物平台代码扫描(命中即红)
        run: |
          # 严格模式回收(1.15.2):SSO 端点白名单已下沉 frontend-core v0.1.6 的
          # HostAdapter.ssoLoginPaths(适配器声明),neutral 产物不再含任何平台
          # 字面量——此前的 api/qnap/login 精确放行(a9977a3 过渡态)已可撤。
          if grep -rloE "trimjs|pickSharedFile|fnosSsoLogin|trim_open_gateway|api/qnap|api/fnos|qnapHostAdapter" dist/assets/ >/dev/null 2>&1; then
            echo "::error::neutral 产物出现宿主平台代码——平台实现只允许进对应 flavor"
            exit 1
          fi
      # 平台 flavor 已全部迁平台仓(fnos/qnap 的 web/ 自包含构建),由各平台 CI 把守
      # 镜像正式发布在 server 仓 release.yml（与 server 同版本列车），此处仅验证
      # Dockerfile 可构建（nginx 模板/产物拷贝路径变更能被 PR 及时发现）
      - name: Docker build smoke
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org -t pigeonbox-frontend:ci .
